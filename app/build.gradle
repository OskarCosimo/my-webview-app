// app/build.gradle
plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

// Optional: load release keystore credentials from a local keystore.properties file (excluded from Git)
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    compileSdk 37
    namespace "com.my.webviewapplication.mobile"

    defaultConfig {
        applicationId 'com.my.webviewapplication.mobile'
        minSdk 23
        targetSdk 37
        versionCode 1116
        versionName "11.1.6"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        if (keystorePropertiesFile.exists()) {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            buildConfigField "Boolean", "IS_DEBUG_MODE", 'true'
        }
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            buildConfigField "Boolean", "IS_DEBUG_MODE", 'false'
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Use release signing config if keystore.properties exists; otherwise sign via Android Studio
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig = true
        viewBinding = true
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // AndroidX Core
    implementation 'androidx.core:core:1.19.0'
    implementation 'androidx.activity:activity:1.13.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'
    implementation 'com.google.android.material:material:1.14.0'

    // Firebase
    implementation platform('com.google.firebase:firebase-bom:34.18.0')
    implementation 'com.google.firebase:firebase-analytics' // Firebase Analytics
    implementation 'com.google.firebase:firebase-messaging' // Firebase Push Messaging
    implementation 'com.google.firebase:firebase-inappmessaging-display' // Firebase In-App Messaging

    // QR Code Scanner (ZXing)
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

    // WebView & Browser
    implementation 'androidx.browser:browser:1.10.0'

    // Splash Screen
    implementation 'androidx.core:core-splashscreen:1.2.0'

    // GIF Support
    implementation 'pl.droidsonroids.gif:android-gif-drawable:1.2.32'

    // Network & Connectivity
    implementation 'androidx.work:work-runtime:2.11.2'

    // Lifecycle
    implementation 'androidx.lifecycle:lifecycle-process:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.11.0'

    // Gson
    implementation 'com.google.code.gson:gson:2.14.0'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
